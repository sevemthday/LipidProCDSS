<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LipidPro CDSS - 血脂決策支援系統</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; align-items: baseline; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .header h1 { margin: 0; font-size: 24px; color: #1f2937; }
        .risk-badge { padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .risk-very-high { background-color: #fee2e2; color: #b91c1c; }
        .risk-high { background-color: #fef3c7; color: #d97706; }
        .risk-normal { background-color: #e0f2fe; color: #0369a1; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .data-box { background: #f8fafc; padding: 20px; border-radius: 8px; border-left: 5px solid; }
        .box-ldl { border-color: #3b82f6; }
        .box-target { border-color: #10b981; }
        .box-tg { border-color: #f59e0b; }
        .box-title { font-size: 14px; color: #64748b; margin-bottom: 8px; }
        .box-value { font-size: 28px; font-weight: bold; color: #1e3a8a; }
        .cdss-alert { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .cdss-title { font-weight: bold; margin-bottom: 10px; color: #1e40af; font-size: 16px; }
        .warning-text { color: #b91c1c; font-weight: bold; }
        .loading { text-align: center; padding: 50px; font-size: 18px; color: #6b7280; }
    </style>
</head>
<body>

<div class="container" id="app-content" style="display: none;">
    <div class="header">
        <h1 id="patient-name">讀取病患中...</h1>
        <span id="risk-badge" class="risk-badge risk-normal">風險評估中</span>
    </div>

    <div class="data-grid">
        <div class="data-box box-ldl">
            <div class="box-title">目前 LDL-C</div>
            <div class="box-value" id="val-ldl">N/A</div>
        </div>
        <div class="data-box box-target">
            <div class="box-title">目標 LDL-C (Guideline)</div>
            <div class="box-value" id="val-target">N/A</div>
        </div>
        <div class="data-box box-tg">
            <div class="box-title">目前 TG (三酸甘油酯)</div>
            <div class="box-value" id="val-tg">N/A</div>
        </div>
    </div>

    <div class="cdss-alert">
        <div class="cdss-title">💡 臨床決策建議 (基於 2026 ACC/AHA & 2022 台灣指引)：</div>
        <div id="cdss-message">系統正在分析病患共病史與檢驗數值...</div>
    </div>
</div>
<div id="loading-msg" class="loading">正在從 FHIR 伺服器同步醫療資料與運算風險模型，請稍候...</div>

<script>
FHIR.oauth2.ready().then(client => {
    const patientId = client.patient.id;
    
    // 定義要抓取的代碼
    const LOINC_LDL = "13457-7";
    const LOINC_TG = "2571-8";
    
    // 使用 Promise.all 同時抓取 Patient, Condition(診斷), Observation(檢驗)
    Promise.all([
        client.request(`Patient/${patientId}`),
        client.request(`Condition?patient=${patientId}`),
        client.request(`Observation?patient=${patientId}&code=${LOINC_LDL},${LOINC_TG}`)
    ]).then(responses => {
        const [patientData, conditionData, obsData] = responses;

        // 1. 處理基本資料
        let ptName = "Unknown";
        if (patientData.name && patientData.name.length > 0) {
            ptName = patientData.name[0].given.join(" ") + " " + patientData.name[0].family;
        }
        document.getElementById("patient-name").innerText = `${ptName} (ID: ${patientId})`;

        // 2. 判斷疾病史 (CDSS 邏輯)
        let hasACS = false;
        let hasDM = false;
        let hasStroke = false;
        let comorbidities = [];

        if (conditionData.entry) {
            conditionData.entry.forEach(entry => {
                let codeItem = entry.resource.code;
                if (codeItem && codeItem.coding) {
                    codeItem.coding.forEach(coding => {
                        let code = coding.code || "";
                        if (code.startsWith("I21")) { hasACS = true; comorbidities.push("急性冠心症(ACS)"); }
                        if (code.startsWith("E11")) { hasDM = true; comorbidities.push("第二型糖尿病(DM)"); }
                        if (code.startsWith("I63")) { hasStroke = true; comorbidities.push("缺血性中風(Stroke)"); }
                    });
                }
            });
        }

        // 3. 處理檢驗數值
        let ldlValue = null;
        let tgValue = null;

        if (obsData.entry) {
            obsData.entry.forEach(entry => {
                let resource = entry.resource;
                let code = resource.code.coding[0].code;
                let value = resource.valueQuantity ? resource.valueQuantity.value : null;
                
                if (code === LOINC_LDL && value) {
                    ldlValue = value;
                    document.getElementById("val-ldl").innerText = `${ldlValue} mg/dL`;
                }
                if (code === LOINC_TG && value) {
                    tgValue = value;
                    document.getElementById("val-tg").innerText = `${tgValue} mg/dL`;
                }
            });
        }

        // 4. CDSS 核心演算法 (風險分級與目標設定)
        let riskLevel = "一般風險 (Normal Risk)";
        let riskClass = "risk-normal";
        let targetLdl = 100; // 預設
        let adviceHtml = "";

        // 判斷極高風險 (Very High Risk)
        if ((hasACS && hasDM) || (hasStroke && hasDM) || (hasACS && hasStroke)) {
            // 共病加乘
            riskLevel = "極高風險 (Very High Risk) - 共病加乘";
            riskClass = "risk-very-high";
            targetLdl = 55;
        } else if (hasACS) {
            // ACS 單一疾病
            riskLevel = "極高風險 (Very High Risk) - ACS";
            riskClass = "risk-very-high";
            targetLdl = 55; // 依台灣指引，近12個月ACS為<55
        } else if (hasStroke) {
            riskLevel = "高風險 (High Risk) - 缺血性中風";
            riskClass = "risk-high";
            targetLdl = 70;
        } else if (hasDM) {
            riskLevel = "高風險 (High Risk) - 糖尿病";
            riskClass = "risk-high";
            targetLdl = 70; // 若無其他危險因子，預設<70
        }

        document.getElementById("risk-badge").innerText = riskLevel;
        document.getElementById("risk-badge").className = `risk-badge ${riskClass}`;
        document.getElementById("val-target").innerText = `< ${targetLdl} mg/dL`;

        // 5. 產出臨床建議 (Clinical Advice)
        let adviceMessages = [];
        
        if (comorbidities.length > 0) {
            adviceMessages.push(`📋 <b>病史偵測：</b>患者具備 <b>${comorbidities.join("、")}</b> 病史。依據指引，LDL-C 目標需嚴格控制在 < ${targetLdl} mg/dL。`);
        }

        // LDL 達標判斷
        if (ldlValue !== null) {
            if (ldlValue > targetLdl) {
                adviceMessages.push(`⚠️ <b>LDL-C 未達標：</b>目前數值 (${ldlValue}) 高於目標值 (< ${targetLdl})。建議考慮提升高強度 Statin 劑量，或合併使用 Ezetimibe / PCSK9 抑制劑治療。`);
            } else {
                adviceMessages.push(`✅ <b>LDL-C 控制優良：</b>已達目標範圍，請持續維持目前藥物與健康生活型態。`);
            }
        } else {
            adviceMessages.push(`⚠️ <b>無近期 LDL-C 紀錄：</b>建議安排抽血檢驗Lipid Panel (含 Lp(a) 與 ApoB)。`);
        }

        // TG 與糖尿病高風險用藥判斷
        if (tgValue !== null && tgValue > 200) {
            if (hasDM) {
                adviceMessages.push(`<br><span class="warning-text">🚨 高三酸甘油酯與糖尿病用藥警示：</span><br>患者患有糖尿病且 TG 異常偏高 (${tgValue} mg/dL)。建議嚴格控制血糖與生活型態介入。若決定使用 Fibric acid 類藥物，<b>強烈推薦使用 Fenofibrate，絕對禁止 Statins 與 Gemfibrozil 併用</b>（會大幅增加橫紋肌溶解症風險）。`);
            } else {
                adviceMessages.push(`⚠️ <b>TG 偏高：</b>目前 TG (${tgValue} mg/dL) 偏高，建議加強生活型態介入 (飲食控制/運動)。`);
            }
        }

        document.getElementById("cdss-message").innerHTML = adviceMessages.join("<br><br>");

        // 顯示畫面
        document.getElementById("loading-msg").style.display = "none";
        document.getElementById("app-content").style.display = "block";

    }).catch(error => {
        document.getElementById("loading-msg").innerText = "資料載入失敗，請確認 Sandbox 連線狀態與授權是否正確。";
        console.error(error);
    });
}).catch(console.error);
</script>

</body>
</html>
