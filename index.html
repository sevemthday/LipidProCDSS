<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>LipidPro CDSS Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #2d3748; }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        .header { border-bottom: 2px solid #edf2f7; padding-bottom: 15px; margin-bottom: 20px; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .risk-extreme { background: #fff5f5; color: #c53030; }
        .risk-high { background: #fffaf0; color: #c05621; }
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .metric-box { padding: 15px; background: #f7fafc; border-radius: 8px; border-left: 5px solid #4299e1; }
        .metric-val { font-size: 28px; font-weight: 600; color: #2b6cb0; }
        .recommendation { background: #ebf8ff; border: 1px solid #bee3f8; padding: 15px; border-radius: 8px; }
        .edu-section { margin-top: 20px; border-top: 1px dashed #cbd5e0; padding-top: 15px; }
        .btn { display: inline-block; padding: 8px 16px; background: #4299e1; color: white; border-radius: 6px; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card" id="app">
        <div id="loading">讀取 FHIR 病歷資料中...</div>
    </div>

    <script>
        FHIR.oauth2.ready().then(client => {
            const patientId = client.patient.id;
            const patientReq = client.patient.read();
            const conditionReq = client.request(`Condition?patient=${patientId}&clinical-status=active`);
            const ldlReq = client.request(`Observation?patient=${patientId}&code=13457-7&_sort=-date&_count=1`);

            Promise.all([patientReq, conditionReq, ldlReq]).then(([patient, conditions, ldlData]) => {
                const name = patient.name[0].family + patient.name[0].given.join('');
                const codes = (conditions.entry || []).map(e => e.resource.code.coding[0].code);
                const currentLdl = ldlData.entry ? ldlData.entry[0].resource.valueQuantity.value : 'N/A';
                
                let riskLevel = "一般風險";
                let targetLdl = 100;
                let eduLink = "https://www.hpa.gov.tw/"; // 預設衛教連結

                // 決策邏輯 (2026 指引)
                if (codes.includes("I21.9") || codes.includes("E11.9")) { 
                    riskLevel = "極高風險 (Very High Risk)";
                    targetLdl = 55;
                    eduLink = "https://www.cvit.org.tw/patient/acs"; // ACS 衛教
                } else if (codes.includes("I63.9")) {
                    riskLevel = "高風險 (High Risk)";
                    targetLdl = 70;
                    eduLink = "https://www.stroke.org.tw/"; // 中風預防衛教
                }

                document.getElementById('app').innerHTML = `
                    <div class="header">
                        <h2>${name} (ID: ${patientId})</h2>
                        <span class="badge ${targetLdl === 55 ? 'risk-extreme' : 'risk-high'}">${riskLevel}</span>
                    </div>
                    <div class="metric-grid">
                        <div class="metric-box">
                            <div>目前 LDL-C</div>
                            <div class="metric-val">${currentLdl} <small>mg/dL</small></div>
                        </div>
                        <div class="metric-box" style="border-color: #48bb78;">
                            <div>目標 LDL-C</div>
                            <div class="metric-val">${targetLdl} <small>mg/dL</small></div>
                        </div>
                    </div>
                    <div class="recommendation">
                        <strong>臨床決策建議：</strong><br>
                        ${currentLdl > targetLdl ? '⚠️ LDL-C 未達標。建議考慮提升高強度 Statin 劑量或合併 Ezetimibe 治療。' : '✅ 控制優良。請持續維持目前藥物與健康生活型態。'}
                    </div>
                    <div class="edu-section">
                        <h4>衛教小視窗</h4>
                        <p>了解您的病況對血脂的要求，能有效預防心肌梗塞與中風復發。</p>
                        <a href="${eduLink}" target="_blank" class="btn">查看個人化衛教資訊</a>
                    </div>
                `;
            });
        }).catch(console.error);
    </script>
</body>
</html>
