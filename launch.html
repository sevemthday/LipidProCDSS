<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LipidPro CDSS - 啟動授權</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f3f4f6; }
        .loader-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    </style>
</head>
<body>
    <div class="loader-box">
        <h3>🔄 系統啟動中</h3>
        <p>正在與電子病歷系統 (EHR) 進行安全連線與授權...</p>
    </div>

    <script>
        // 啟動 SMART on FHIR 授權流程
        FHIR.oauth2.authorize({
            // 申請讀取病患基本資料、診斷紀錄、檢驗紀錄的權限
            scope: "patient/Patient.read patient/Condition.read patient/Observation.read launch online_access openid profile",
            // 授權成功後，跳轉到決策儀表板
            redirect_uri: "index.html"
        });
    </script>
</body>
</html>
